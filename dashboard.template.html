<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>AfaScan — andamento</title>
<style>
:root { color-scheme: light dark; --bg: light-dark(#f6f7f9,#101216); --fg: light-dark(#17202a,#f3f5f7); --muted: light-dark(#5d6875,#aab4bf); --card: light-dark(#fff,#191d23); --line: light-dark(#d8dde3,#323944); --accent: #ed2e61; --accent-soft: light-dark(#fde7ee,#4d1d2e); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
main { width: min(1120px, calc(100% - 32px)); margin: 28px auto 48px; }
h1 { margin: 0 0 4px; font-size: clamp(24px, 4vw, 36px); letter-spacing: -.02em; }
.sub { color: var(--muted); margin: 0 0 24px; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-bottom: 18px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.metric-label { color: var(--muted); font-size: 13px; }
.metric { font-size: 26px; font-weight: 650; margin-top: 3px; }
.delta { color: var(--muted); font-size: 12px; margin-top: 3px; }
.delta.good { color: #198754; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 18px; }
.toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom: 10px; }
label { color: var(--muted); font-size: 13px; }
select { margin-left: 6px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); }
svg { width: 100%; height: 310px; display:block; }
.axis { stroke: var(--line); stroke-width: 1; }
.gridline { stroke: var(--line); stroke-width: 1; opacity: .55; }
.series { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.dot { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
.chart-text { fill: var(--muted); font-size: 12px; }
.table-wrap { overflow-x: auto; }
table { width:100%; border-collapse: collapse; min-width: 720px; }
th, td { text-align:left; padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-size: 12px; font-weight: 500; }
td { font-variant-numeric: tabular-nums; }
.badge { color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 999px; font-size: 12px; }
.details-title { margin: 0; font-size: 20px; font-weight: 600; }
.details-content { margin-top: 16px; }
.detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.detail-block { min-width: 0; }
.detail-block h3 { margin: 0 0 8px; font-size: 16px; font-weight: 500; }
.detail-table { min-width: 0; }
.detail-table th, .detail-table td { padding: 7px 8px; }
.detail-table th { width: 65%; }
.detail-note { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
.detail-deltas { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
.detail-delta { color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 5px 9px; font-size: 12px; font-variant-numeric: tabular-nums; }
.detail-delta.good { color: #198754; }
.row-value { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; text-align: right; }
.row-delta { color: var(--muted); font-size: 11px; font-weight: 400; }
.row-delta.good { color: #198754; }
.row-delta.bad { color: var(--accent); }
@media (max-width: 760px) { .grid { grid-template-columns: repeat(2,minmax(0,1fr)); } main { width: min(100% - 20px, 1120px); margin-top: 18px; } }
@media (max-width: 560px) { .detail-grid { grid-template-columns: 1fr; } }
</style>
<main id="app">
  <h1>AfaScan — andamento</h1>
  <p class="sub" id="subtitle"></p>
  <section class="grid" id="summary" aria-label="Ultima pesata"></section>
  <section class="panel">
    <div class="toolbar">
      <strong id="chart-title">Andamento</strong>
      <label>Parametro <select id="metric"></select></label>
    </div>
    <svg id="chart" viewBox="0 0 900 310" role="img" aria-label="Grafico dell'andamento nel tempo"></svg>
  </section>
  <section class="panel">
    <div class="toolbar"><strong>Tutte le pesate</strong><span class="badge" id="count"></span></div>
    <div class="table-wrap"><table><thead><tr>
      <th>Data</th><th>Peso</th><th>Massa muscolare scheletrica</th><th>% grasso</th><th>Massa grassa</th><th>BMI</th><th>BMR</th><th>Viscerale</th><th>Acqua</th><th>Score</th>
    </tr></thead><tbody id="rows"></tbody></table></div>
  </section>
  <section class="panel">
    <div id="details-panel">
      <h2 class="details-title">Dettagli segmentali e del referto</h2>
      <div class="toolbar details-content">
        <span class="detail-note" id="details-date-label"></span>
        <label>Pesata <select id="detail-date"></select></label>
      </div>
      <div class="detail-deltas" id="detail-deltas" aria-live="polite"></div>
      <div class="detail-grid" id="details-content"></div>
    </div>
  </section>
</main>
<script>
const records = __MEASUREMENTS_JSON__.filter(r => r.date).sort((a,b) => a.date.localeCompare(b.date));
const fields = {
  weight_kg: ['Peso', 'kg'],
  body_fat_percent: ['Grasso corporeo', '%'],
  skeletal_muscle_mass_kg: ['Massa muscolare scheletrica', 'kg'],
  body_fat_mass_kg: ['Massa grassa', 'kg'],
  bmi: ['BMI', ''],
  basal_metabolic_rate_kcal: ['Metabolismo basale', 'kcal'],
  visceral_fat_level: ['Grasso viscerale', ''],
  water_percent: ['Acqua', '%']
};
const fmt = (n, digits=1) => n == null ? '—' : Number(n).toLocaleString('it-IT', {maximumFractionDigits:digits, minimumFractionDigits:digits});
const latest = records.at(-1), first = records[0];
document.getElementById('subtitle').textContent = records.length ? `${records.length} referti · dal ${first.date} al ${latest.date}` : 'Nessun referto importato';
document.getElementById('count').textContent = `${records.length} referti`;
const summaryFields = ['weight_kg','body_fat_percent','skeletal_muscle_mass_kg','body_fat_mass_kg'];
document.getElementById('summary').innerHTML = summaryFields.map(key => {
  const [label, unit] = fields[key]; const delta = latest[key] != null && first[key] != null ? latest[key]-first[key] : null;
  const sign = delta > 0 ? '+' : ''; const good = key === 'skeletal_muscle_mass_kg' ? delta >= 0 : key.includes('fat') || key === 'weight_kg' ? delta <= 0 : false;
  return `<div class="card"><div class="metric-label">${label}</div><div class="metric">${fmt(latest[key])} ${unit}</div><div class="delta ${good ? 'good' : ''}">${delta == null ? '' : `${sign}${fmt(delta)} ${unit} dal primo referto`}</div></div>`;
}).join('');
const select = document.getElementById('metric');
Object.entries(fields).forEach(([key,[label,unit]]) => { const opt = document.createElement('option'); opt.value=key; opt.textContent=`${label}${unit ? ` (${unit})` : ''}`; select.appendChild(opt); });
select.value = 'weight_kg'; select.addEventListener('change', () => draw(select.value));
function draw(key) {
  const svg = document.getElementById('chart'); const W=900,H=310,L=58,R=20,T=18,B=42; const vals=records.map(r=>Number(r[key])).filter(Number.isFinite);
  if (!vals.length) { svg.innerHTML=''; return; }
  const min=Math.min(...vals), max=Math.max(...vals), pad=(max-min || 1)*.15; const lo=min-pad, hi=max+pad;
  const x=i => L + (records.length === 1 ? (W-L-R)/2 : i*(W-L-R)/(records.length-1)); const y=v => T + (hi-v)*(H-T-B)/(hi-lo);
  const points=records.map((r,i)=>Number.isFinite(Number(r[key])) ? `${x(i)},${y(Number(r[key]))}` : '').filter(Boolean).join(' ');
  const ticks=4; let html=''; for(let i=0;i<=ticks;i++){ const v=lo+(hi-lo)*i/ticks, yy=y(v); html += `<line class="gridline" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="chart-text" x="${L-8}" y="${yy+4}" text-anchor="end">${fmt(v)}</text>`; }
  html += `<line class="axis" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/><polyline class="series" points="${points}"/>`;
  records.forEach((r,i)=>{ if(Number.isFinite(Number(r[key]))) html += `<circle class="dot" cx="${x(i)}" cy="${y(Number(r[key]))}" r="5"><title>${r.date}: ${fmt(r[key])} ${fields[key][1]}</title></circle>`; html += `<text class="chart-text" x="${x(i)}" y="${H-16}" text-anchor="middle">${r.date.slice(5)}</text>`; });
  svg.innerHTML=html; document.getElementById('chart-title').textContent = fields[key][0];
}
draw('weight_kg');
document.getElementById('rows').innerHTML = records.slice().reverse().map(r => `<tr><td>${r.date}</td><td>${fmt(r.weight_kg)} kg</td><td>${fmt(r.skeletal_muscle_mass_kg)} kg</td><td>${fmt(r.body_fat_percent)}%</td><td>${fmt(r.body_fat_mass_kg)} kg</td><td>${fmt(r.bmi)}</td><td>${r.basal_metabolic_rate_kcal ?? '—'} kcal</td><td>${r.visceral_fat_level ?? '—'}</td><td>${fmt(r.water_percent)}%</td><td>${r.score ?? '—'}/100</td></tr>`).join('');
const segmentLabels = { right_arm: 'Braccio destro', left_arm: 'Braccio sinistro', trunk: 'Tronco', right_leg: 'Gamba destra', left_leg: 'Gamba sinistra' };
const detailDate = document.getElementById('detail-date');
records.slice().reverse().forEach(r => { const option = document.createElement('option'); option.value = r.date; option.textContent = r.date; detailDate.appendChild(option); });
detailDate.value = latest?.date ?? '';
detailDate.addEventListener('change', renderDetails);
function segmentTable(title, values, baselineValues, reductionIsGood) {
  const rows = values ? Object.entries(segmentLabels).map(([key,label]) => {
    const current = values[key];
    const baseline = baselineValues?.[key];
    const delta = current != null && baseline != null ? current - baseline : null;
    const status = delta == null || delta === 0 ? '' : (reductionIsGood ? (delta < 0 ? 'good' : 'bad') : (delta > 0 ? 'good' : 'bad'));
    const comparison = delta == null ? '' : `<span class="row-delta ${status}">${signed(delta, 2)} kg dal primo referto</span>`;
    return `<tr><th>${label}</th><td><span class="row-value"><span>${fmt(current, 2)} kg</span>${comparison}</span></td></tr>`;
  }).join('') : '<tr><td colspan="2">Non disponibile</td></tr>';
  return `<div class="detail-block"><h3>${title}</h3><table class="detail-table"><tbody>${rows}</tbody></table></div>`;
}
function detailTable(title, rows) {
  const renderedRows = rows.map(({label, value, current, baseline, unit = '', digits = 1, increaseIsGood = null}) => {
    const delta = current != null && baseline != null ? current - baseline : null;
    const status = delta == null || delta === 0 || increaseIsGood == null ? '' : (increaseIsGood ? (delta > 0 ? 'good' : 'bad') : (delta < 0 ? 'good' : 'bad'));
    const comparison = delta == null ? '' : `<span class="row-delta ${status}">${signed(delta, digits)} ${unit} dal primo referto</span>`;
    return `<tr><th>${label}</th><td><span class="row-value"><span>${value}</span>${comparison}</span></td></tr>`;
  }).join('');
  return `<div class="detail-block"><h3>${title}</h3><table class="detail-table"><tbody>${renderedRows}</tbody></table></div>`;
}
function signed(value, digits=1) {
  if (value == null) return '—';
  return `${value > 0 ? '+' : ''}${fmt(value, digits)}`;
}
function renderDeltas(record) {
  const deltas = [
    ['Peso', record.weight_kg - first.weight_kg, 'kg', true],
    ['Grasso corporeo', record.body_fat_percent - first.body_fat_percent, 'pp', true],
    ['Massa muscolare', record.skeletal_muscle_mass_kg - first.skeletal_muscle_mass_kg, 'kg', false]
  ];
  document.getElementById('detail-deltas').innerHTML = deltas.map(([label, value, unit, favorableReduction]) => {
    const good = favorableReduction ? value <= 0 : value >= 0;
    return `<span class="detail-delta ${good ? 'good' : ''}">${label} ${signed(value)} ${unit} dal primo referto</span>`;
  }).join('');
}
function renderDetails() {
  const record = records.find(r => r.date === detailDate.value) ?? latest;
  if (!record) return;
  document.getElementById('details-date-label').textContent = `Valori riportati nel referto del ${record.date}`;
  renderDeltas(record);
  document.getElementById('details-content').innerHTML = [
    segmentTable('Massa grassa segmentale', record.segment_fat_kg, first?.segment_fat_kg, true),
    segmentTable('Massa magra segmentale', record.segment_lean_kg, first?.segment_lean_kg, false),
    detailTable('Composizione', [
      { label: 'Massa muscolare totale', value: `${fmt(record.muscle_mass_kg)} kg`, current: record.muscle_mass_kg, baseline: first?.muscle_mass_kg, unit: 'kg', increaseIsGood: true },
      { label: 'Massa ossea', value: `${fmt(record.bone_mass_kg)} kg`, current: record.bone_mass_kg, baseline: first?.bone_mass_kg, unit: 'kg' },
      { label: 'Massa grassa', value: `${fmt(record.body_fat_mass_kg)} kg`, current: record.body_fat_mass_kg, baseline: first?.body_fat_mass_kg, unit: 'kg', increaseIsGood: false },
      { label: 'Peso obiettivo', value: `${fmt(record.target_weight_kg)} kg`, current: record.target_weight_kg, baseline: first?.target_weight_kg, unit: 'kg' }
    ]),
    detailTable('Parametri aggiuntivi', [
      { label: 'Metabolismo basale', value: `${record.basal_metabolic_rate_kcal ?? '—'} kcal`, current: record.basal_metabolic_rate_kcal, baseline: first?.basal_metabolic_rate_kcal, unit: 'kcal', digits: 0 },
      { label: 'Grasso viscerale', value: record.visceral_fat_level ?? '—', current: record.visceral_fat_level, baseline: first?.visceral_fat_level, unit: 'livelli', digits: 0, increaseIsGood: false },
      { label: 'Proteine', value: `${fmt(record.protein_percent)}%`, current: record.protein_percent, baseline: first?.protein_percent, unit: 'pp' },
      { label: 'Acqua', value: `${fmt(record.water_percent)}%`, current: record.water_percent, baseline: first?.water_percent, unit: 'pp' },
      { label: 'Score AfaScan', value: `${record.score ?? '—'} / 100`, current: record.score, baseline: first?.score, unit: 'punti', digits: 0, increaseIsGood: true }
    ])
  ].join('');
}
renderDetails();
</script>
