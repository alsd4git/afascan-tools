name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Check formatting and lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q

      - name: Compile Python sources
        run: uv run python -m compileall -q parse_scans.py tests

      - name: Smoke-test dashboard generation without private data
        run: uv run parse_scans.py --no-ocr

      - name: Smoke-test dashboard runtime
        run: |
          node tests/dashboard_smoke.mjs dashboard.html empty
          node tests/dashboard_smoke.mjs dashboard.html sample
