name: Web app

on:
  push:
    branches-ignore: [gh-pages]
    paths: ["web/**", "dashboard.template.html", "favicon.svg", "tests/fixtures/**", "tests/test_parser_fixtures.py", ".github/workflows/web.yml"]
  pull_request:
    branches: [main]
    paths: ["web/**", "dashboard.template.html", "favicon.svg", "tests/fixtures/**", "tests/test_parser_fixtures.py", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Tests
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        env:
          VITE_DEPLOYMENT_KEY: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/dist
          if-no-files-found: error

  publish:
    name: Publish branch preview
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: afascan-pages
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: web-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: branch-build
      - name: Resolve preview path
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          RAW="${GITHUB_REF_NAME}"
          DIR="$(printf '%s' "$RAW" | sed -E 's#[^A-Za-z0-9._-]+#-#g; s#^-+##; s#-+$##')"
          test -n "$DIR"
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
      - name: Compose persisted Pages state
        shell: bash
        env:
          BRANCH_DIR: ${{ steps.branch.outputs.dir }}
        run: |
          set -euo pipefail
          if git fetch origin gh-pages:refs/remotes/origin/gh-pages; then
            git worktree add pages-state refs/remotes/origin/gh-pages
          else
            git worktree add --detach pages-state HEAD
            (cd pages-state && git checkout --orphan gh-pages && git rm -rf .)
          fi
          rm -rf "pages-state/$BRANCH_DIR"
          mkdir -p "pages-state/$BRANCH_DIR"
          cp -a branch-build/. "pages-state/$BRANCH_DIR/"
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            find pages-state -maxdepth 1 -type f ! -name '.nojekyll' -delete
            rm -rf pages-state/assets pages-state/ocr
            cp -a branch-build/. pages-state/
          fi
          touch pages-state/.nojekyll
          (cd pages-state && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add -A && (git diff --cached --quiet || (git commit -m "docs(pages): publish ${GITHUB_REF_NAME} preview" && git push origin HEAD:gh-pages)))
          mkdir pages-artifact
          rsync -a --exclude='.git' pages-state/ pages-artifact/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-artifact
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Report preview URL
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
          BRANCH_DIR: ${{ steps.branch.outputs.dir }}
          BRANCH_RAW: ${{ steps.branch.outputs.raw }}
        run: |
          PREVIEW_URL="${BASE_URL%/}/${BRANCH_DIR}/"
          echo "### GitHub Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "- Canonical: ${BASE_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch preview (${BRANCH_RAW}): ${PREVIEW_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Branch preview::${PREVIEW_URL}"
