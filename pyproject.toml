[project]
name = "afascan-tools"
version = "0.1.0"
description = "OCR, normalization and local dashboards for AfaScan reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
]
